# Builds the pipeline image - the container every Cloud Run Job execution runs.
#
# Context is the repo ROOT, matching cloudbuild.api.yaml, so both builds share
# the one tested .gcloudignore. (This image only needs backend/, so a narrower
# context would upload slightly less; a second ignore file to keep in sync is
# not worth the megabyte.)
#
# This config exists for the same reason cloudbuild.api.yaml does:
# `gcloud builds submit --tag` can only build a file named exactly
# `Dockerfile`, and this repo has three.
#
# Run from the repo root:
#
#   gcloud builds submit --config cloudbuild.pipeline.yaml `
#     --substitutions=_IMAGE=asia-southeast3-docker.pkg.dev/world-genre-natt/world-genre/pipeline
#
# No frontend build beforehand, unlike the API image - nothing here serves a
# page.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=backend/Dockerfile.pipeline
      - --tag=${_IMAGE}
      - .

# Listing the image is what makes Cloud Build push it. Without this block it is
# built and then discarded, which looks like a passing build followed by an
# inexplicable "image not found" at deploy time.
images:
  - ${_IMAGE}

# Cloud Build's default (LEGACY) writes logs to BOTH Cloud Logging and a
# Google-managed GCS bucket. gcloud streams from that bucket, and a service
# account that is not project Viewer/Owner cannot read it - which surfaces as
# "This tool can only stream logs if you are Viewer/Owner of the project" and a
# non-zero exit, even though the build itself started fine and usually
# succeeds. Writing to Cloud Logging only removes the bucket, and with it the
# failure mode.
options:
  logging: CLOUD_LOGGING_ONLY
