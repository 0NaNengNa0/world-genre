name: Backend CI

# Only runs on backend changes - the frontend has its own build/lint step
# via Vite and doesn't need Python tooling to validate it.
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-pipeline.txt
            backend/requirements-api.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-pipeline.txt -r requirements-api.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v
